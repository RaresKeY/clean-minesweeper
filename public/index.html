<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2221">
    <title>Clean Minesweeper</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-theme="dark">
    <main class="shell" aria-labelledby="game-title">
      <h1 id="game-title" class="sr-only">Clean Minesweeper</h1>

      <header class="hud">
        <div class="counters">
          <output id="mine-count" class="counter" aria-label="Mines remaining: 10">10</output>
          <output id="timer" class="counter" aria-label="Elapsed time: 0 seconds">0</output>
        </div>
        <button
          id="menu-button"
          class="menu-button"
          type="button"
          aria-expanded="false"
          aria-controls="game-menu"
        >Menu</button>
      </header>

      <nav id="game-menu" class="game-menu" aria-label="Game menu" hidden>
        <div data-menu-view="root">
          <button class="menu-item" type="button" data-menu-target="board">
            <span>Board</span><span aria-hidden="true">&gt;</span>
          </button>
          <button class="menu-item" type="button" data-menu-target="theme">
            <span>Theme</span><span aria-hidden="true">&gt;</span>
          </button>
          <button id="flag-mode-button" class="menu-item" type="button" aria-pressed="false">
            Flag off
          </button>
          <button id="reset-button" class="menu-item" type="button">Reset</button>
        </div>

        <div data-menu-view="board" hidden>
          <button class="menu-item menu-back" type="button" data-menu-target="root">
            <span aria-hidden="true">&lt;</span><span>Back</span>
          </button>
          <button class="menu-item" type="button" data-difficulty="beginner">Beginner</button>
          <button class="menu-item" type="button" data-difficulty="intermediate">Intermediate</button>
          <button class="menu-item" type="button" data-difficulty="expert">Expert</button>
          <button
            id="custom-board-button"
            class="menu-item"
            type="button"
            data-menu-target="custom"
          >Custom</button>
        </div>

        <div data-menu-view="custom" hidden>
          <button class="menu-item menu-back" type="button" data-menu-target="board">
            <span aria-hidden="true">&lt;</span><span>Back</span>
          </button>
          <form id="custom-board-form" class="custom-board-form" novalidate>
            <label class="custom-board-field" for="custom-width">
              <span>Width</span>
              <input
                id="custom-width"
                class="custom-board-input"
                type="number"
                min="9"
                max="30"
                value="9"
                inputmode="numeric"
                aria-describedby="custom-board-limits custom-board-error"
                data-menu-focus
                required
              >
            </label>
            <label class="custom-board-field" for="custom-height">
              <span>Height</span>
              <input
                id="custom-height"
                class="custom-board-input"
                type="number"
                min="9"
                max="24"
                value="9"
                inputmode="numeric"
                aria-describedby="custom-board-limits custom-board-error"
                required
              >
            </label>
            <label class="custom-board-field" for="custom-mines">
              <span>Mines</span>
              <input
                id="custom-mines"
                class="custom-board-input"
                type="number"
                min="10"
                max="80"
                value="10"
                inputmode="numeric"
                aria-describedby="custom-board-limits custom-board-error"
                required
              >
            </label>
            <p id="custom-board-limits" class="custom-board-limits">
              Width 9–30, height 9–24, up to 668 mines.
            </p>
            <p id="custom-board-error" class="custom-board-error" aria-live="polite"></p>
            <button class="menu-item custom-board-start" type="submit">Start</button>
          </form>
        </div>

        <div data-menu-view="theme" hidden>
          <button class="menu-item menu-back" type="button" data-menu-target="root">
            <span aria-hidden="true">&lt;</span><span>Back</span>
          </button>
          <button class="menu-item" type="button" data-theme-option="dark">Dark</button>
          <button class="menu-item" type="button" data-theme-option="light">Light</button>
        </div>
      </nav>

      <p id="status" class="sr-only" aria-live="polite">Choose a square to start.</p>

      <section class="board-stage" aria-label="Minesweeper board">
        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Minesweeper grid"></div>
        </div>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
